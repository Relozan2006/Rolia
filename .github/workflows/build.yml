name: Build Rolia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure git
        run: |
          git config --global user.email "ci@rolia.local"
          git config --global user.name "Rolia CI"

      - name: Apply patches
        id: apply
        run: |
          set -o pipefail
          (./gradlew applyAllPatches --no-parallel --stacktrace || { echo RETRYING; rm -rf .gradle/caches/paperweight/upstreams; ./gradlew applyAllPatches --no-parallel --stacktrace; }) 2>&1 | tee apply.log

      - name: Collect base files on patch failure
        if: failure()
        run: |
          mkdir -p /tmp/out/basefiles
          for f in net/minecraft/world/level/levelgen/RandomState.java net/minecraft/world/level/chunk/ChunkGeneratorStructureState.java; do
            { find . -path "*/$f" 2>/dev/null; find ~/.gradle -path "*/$f" 2>/dev/null; } | while read -r pth; do
              key=$(echo "$pth" | sed 's|[/.]|_|g')
              cp "$pth" "/tmp/out/basefiles/$key" 2>/dev/null || true
            done
          done
          find . ~/.gradle -name '*.rej' 2>/dev/null | head -50 > /tmp/out/basefiles/rej_list.txt || true
          ls -la /tmp/out/basefiles

      - name: Dump reference sources
        run: |
          mkdir -p /tmp/out/refsrc
          for f in net/minecraft/world/RandomSequences.java net/minecraft/world/level/levelgen/feature/EndSpikeFeature.java; do
            src="canvas-server/src/minecraft/java/$f"
            if [ -f "$src" ]; then cp "$src" "/tmp/out/refsrc/$(basename $f)"; else echo "MISSING $f" >> /tmp/out/refsrc/missing.txt; fi
          done
          ls -la /tmp/out/refsrc

      - name: Locate end spike seed usage
        run: |
          mkdir -p /tmp/out
          { grep -rn "getSpikesForLevel\|SpikeCacheLoader\|EndSpike\|SpikeConfiguration" canvas-server/src/minecraft/java --include=*.java | head -20; \
            grep -rln "RandomSource.create(level.getSeed()\|RandomSource.create(this.getSeed()\|create(worldGenLevel.getSeed()" canvas-server/src/minecraft/java --include=*.java | head -10; } > /tmp/out/endspike.txt || true
          cat /tmp/out/endspike.txt

      - name: Build paperclip jar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: (./gradlew createMojmapPaperclipJar --stacktrace || ./gradlew createPaperclipJar --stacktrace) 2>&1 | tee build.log

      - name: Smoke test server
        run: |
          set -x
          JAR=$(find . -name '*paperclip*.jar' -not -path './testrun/*' | head -1)
          cp "$JAR" /tmp/rolia.jar
          mkdir -p testrun && cd testrun
          echo "eula=true" > eula.txt
          mkfifo input
          (java -Xmx3G -jar /tmp/rolia.jar --nogui < input > server.log 2>&1; echo $? > exitcode) &
          exec 3>input
          ok=""
          for i in $(seq 1 180); do
            if grep -q 'Done' server.log 2>/dev/null; then ok=1; break; fi
            if [ -f exitcode ]; then break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then echo "SERVER FAILED TO START"; tail -100 server.log; exit 1; fi
          sleep 5
          echo "seed" >&3
          sleep 5
          echo "version" >&3
          sleep 5
          echo "stop" >&3
          for i in $(seq 1 36); do [ -f exitcode ] && break; sleep 5; done
          echo "=== branding check ==="
          grep -i 'rolia' server.log | head -20
          echo "=== seed check ==="
          grep -i 'feature seed' server.log | head -5
          grep -qi 'rolia' server.log || { echo "NO ROLIA BRANDING"; exit 1; }
          grep -qi 'feature seed' server.log || { echo "NO FEATURE SEED"; exit 1; }

      - name: Publish result to ci-output branch
        if: always()
        run: |
          set -x
          mkdir -p /tmp/out
          find . -name '*paperclip*.jar' -not -path './testrun/*' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          cp testrun/server.log /tmp/out/ 2>/dev/null || true
          cp apply.log build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          f=$(ls *paperclip*.jar 2>/dev/null | head -1); if [ -n "$f" ] && [ "$f" != "rolia-paperclip-26.1.2.jar" ]; then mv "$f" rolia-paperclip-26.1.2.jar; fi
          for f in *.jar; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          echo "status=${{ job.status }}" > status.txt
          echo "commit=$GITHUB_SHA" >> status.txt
          # truncate big logs
          for f in apply.log build.log; do [ -f "$f" ] && tail -c 500000 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          git init -b ci-output
          git config user.email "ci@rolia.local"
          git config user.name "Rolia CI"
          git add -A
          git commit -m "CI output for $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-output

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v26.1.2-build.${GITHUB_RUN_NUMBER}"
          JAR=/tmp/out/rolia-paperclip-26.1.2.jar
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          cat > /tmp/relnotes.md << NOTES
          ## Rolia 26.1.2

          **Rolia** — высокопроизводительное ядро Minecraft на базе Canvas с полной поддержкой 1024-битного сида.

          ### Особенности
          - Вся производительность Canvas: региональная многопоточность (Folia), оптимизации тиков, чанков и сущностей.
          - **1024-битный защищённый сид**: генерация структур, жеод, слизневых чанков и террейна управляется криптографическим 1024-битным сидом — подбор сида по миру практически невозможен.
          - Секретная соль в \`rolia-seed.properties\` — дополнительная защита от копирования мира.
          - Команда \`/seed\` показывает и ванильный сид, и feature seed.
          - Параметр \`feature-level-seed\` в \`server.properties\` для задания своего 1024-битного сида.

          ### Запуск
          Требуется Java 25+.
          \`\`\`
          java -Xmx4G -jar rolia-paperclip-26.1.2.jar --nogui
          \`\`\`

          ### Контрольная сумма
          SHA-256: \`$SHA\`
          NOTES
          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rolia 26.1.2 (build ${GITHUB_RUN_NUMBER})" \
            --notes-file /tmp/relnotes.md \
            --latest
