name: Build Rolia

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure git
        run: |
          git config --global user.email "ci@rolia.local"
          git config --global user.name "Rolia CI"

      - name: Apply patches
        id: apply
        run: |
          set -o pipefail
          (./gradlew applyAllPatches --no-parallel --stacktrace || { echo RETRYING; rm -rf .gradle/caches/paperweight/upstreams; ./gradlew applyAllPatches --no-parallel --stacktrace; }) 2>&1 | tee apply.log

      - name: Collect base files on patch failure
        if: failure()
        run: |
          mkdir -p /tmp/out/basefiles
          for f in net/minecraft/world/level/levelgen/RandomState.java net/minecraft/world/level/chunk/ChunkGeneratorStructureState.java; do
            { find . -path "*/$f" 2>/dev/null; find ~/.gradle -path "*/$f" 2>/dev/null; } | while read -r pth; do
              key=$(echo "$pth" | sed 's|[/.]|_|g')
              cp "$pth" "/tmp/out/basefiles/$key" 2>/dev/null || true
            done
          done
          find . ~/.gradle -name '*.rej' 2>/dev/null | head -50 > /tmp/out/basefiles/rej_list.txt || true
          ls -la /tmp/out/basefiles

      - name: Dump reference sources
        run: |
          mkdir -p /tmp/out/refsrc
          for f in net/minecraft/world/RandomSequences.java net/minecraft/world/level/levelgen/feature/EndSpikeFeature.java net/minecraft/world/entity/Mob.java net/minecraft/world/entity/ai/Brain.java net/minecraft/world/entity/npc/villager/Villager.java net/minecraft/world/entity/LivingEntity.java net/minecraft/world/entity/Entity.java net/minecraft/world/entity/ai/goal/GoalSelector.java net/minecraft/world/entity/ai/goal/Goal.java net/minecraft/world/entity/ai/goal/WrappedGoal.java net/minecraft/world/entity/ai/sensing/Sensor.java net/minecraft/network/FriendlyByteBuf.java net/minecraft/network/VarInt.java net/minecraft/network/VarLong.java net/minecraft/network/syncher/SynchedEntityData.java net/minecraft/network/protocol/game/ClientboundLightUpdatePacketData.java net/minecraft/world/phys/shapes/Shapes.java net/minecraft/world/phys/shapes/CollisionContext.java net/minecraft/core/MappedRegistry.java net/minecraft/core/Holder.java net/minecraft/core/Registry.java net/minecraft/world/level/chunk/PalettedContainer.java net/minecraft/util/RandomSource.java net/minecraft/util/Mth.java net/minecraft/world/level/levelgen/RandomState.java net/minecraft/world/level/chunk/ChunkGenerator.java net/minecraft/world/entity/projectile/ThrownEnderpearl.java net/minecraft/world/entity/TamableAnimal.java net/minecraft/world/entity/Leashable.java net/minecraft/nbt/CompoundTag.java net/minecraft/world/entity/raid/Raid.java net/minecraft/world/level/chunk/storage/RegionFile.java net/minecraft/world/level/chunk/storage/RegionFileStorage.java net/minecraft/world/level/Level.java net/minecraft/server/level/ServerLevel.java net/minecraft/server/MinecraftServer.java net/minecraft/server/players/PlayerList.java net/minecraft/world/entity/npc/villager/VillagerTrades.java; do
            src="canvas-server/src/minecraft/java/$f"
            if [ -f "$src" ]; then cp "$src" "/tmp/out/refsrc/$(basename $f)"; else echo "MISSING $f" >> /tmp/out/refsrc/missing.txt; fi
          done
          ls -la /tmp/out/refsrc

      - name: Locate end spike seed usage
        run: |
          mkdir -p /tmp/out
          { grep -rn "getSpikesForLevel\|SpikeCacheLoader\|EndSpike\|SpikeConfiguration" canvas-server/src/minecraft/java --include=*.java | head -20; \
            grep -rln "RandomSource.create(level.getSeed()\|RandomSource.create(this.getSeed()\|create(worldGenLevel.getSeed()" canvas-server/src/minecraft/java --include=*.java | head -10; } > /tmp/out/endspike.txt || true
          cat /tmp/out/endspike.txt

      - name: Apply Rolia DAB source hooks
        run: python3 scripts/apply_dab_hooks.py

      - name: Build paperclip jar
        env:
          BUILD_NUMBER: 36
        run: (./gradlew createMojmapPaperclipJar --stacktrace || ./gradlew createPaperclipJar --stacktrace) 2>&1 | tee build.log

      - name: Smoke test server (run twice)
        run: |
          set -x
          JAR=$(find . -name '*paperclip*.jar' -not -path './testrun/*' | head -1)
          cp "$JAR" /tmp/rolia.jar
          mkdir -p testrun && cd testrun
          echo "eula=true" > eula.txt

          run_server () {
            tag="$1"; log="server_${tag}.log"
            rm -f input exitcode
            mkfifo input
            (java -Xmx3G -jar /tmp/rolia.jar --nogui < input > "$log" 2>&1; echo $? > exitcode) &
            exec 3>input
            ok=""
            for i in $(seq 1 180); do
              grep -q 'Done (' "$log" 2>/dev/null && { ok=1; break; }
              [ -f exitcode ] && break
              sleep 5
            done
            if [ -z "$ok" ]; then echo "[$tag] SERVER FAILED TO START"; tail -120 "$log"; exec 3>&- || true; exit 1; fi
            sleep 5; echo "version" >&3
            sleep 6; echo "seed" >&3
            sleep 5; echo "stop" >&3
            for i in $(seq 1 36); do [ -f exitcode ] && break; sleep 5; done
            exec 3>&- || true
            echo "=== [$tag] branding + seed lines ==="
            grep -iE 'running rolia|feature seed' "$log" | head
            echo "=== [$tag] /version output (brand must say Rolia) ==="
            grep -iE 'checking version|\[Rolia\]|\| STABLE|made by' "$log" | head
            grep -qi 'rolia' "$log" || { echo "[$tag] NO ROLIA BRANDING"; exit 1; }
            grep -qi 'feature seed' "$log" || { echo "[$tag] NO FEATURE SEED"; exit 1; }
            if grep -Eq 'Exception in thread|Caused by:|Failed to start the minecraft server' "$log"; then
              echo "[$tag] FATAL ERRORS DETECTED"; grep -nE 'Exception in thread|Caused by:' "$log" | head; exit 1
            fi
            ec=$(cat exitcode 2>/dev/null || echo 1)
            [ "$ec" = "0" ] || { echo "[$tag] non-zero exit ($ec)"; tail -60 "$log"; exit 1; }
          }

          run_server first     # fresh world: generates world + rolia.yml
          echo "=== F3 server brand (serverModName -> minecraft:brand payload) ==="
          grep -i 'serverModName' canvas-server.yml 2>/dev/null || echo "(canvas-server.yml not persisted on first run; F3 brand = brandName() = Rolia)"
          run_server second    # restart on same world: must load cleanly, identical feature seed

          FS1=$(grep -oiE 'feature seed: \[[0-9]+\]' server_first.log  | grep -oE '[0-9]+' | head -1)
          FS2=$(grep -oiE 'feature seed: \[[0-9]+\]' server_second.log | grep -oE '[0-9]+' | head -1)
          echo "run1 feature seed: $FS1"
          echo "run2 feature seed: $FS2"
          [ -n "$FS1" ] || { echo "feature seed not printed"; exit 1; }
          [ "${#FS1}" -ge 20 ] || { echo "feature seed too short (not 1024-bit?): $FS1"; exit 1; }
          [ "$FS1" = "$FS2" ] || { echo "feature seed changed across restart: $FS1 vs $FS2"; exit 1; }
          echo "SMOKE TEST OK: two clean starts, stable 1024-bit feature seed, no fatal errors"

      - name: Determinism + seed-split test
        run: |
          set -x
          set +e +o pipefail   # assertions are explicit; empty greps must not abort
          cd testrun
          SALT="DETERMINISMSALT_DETERMINISMSALT_DETERMINISMSALT_DETERMINISM_0123"
          FSEED="12345678901234567890123456789012345678901234567890"
          FSEED2="98765432109876543210987654321098765432109876543210"
          locate_run () {
            tag="$1"; fs="$2"
            rm -rf world world_nether world_the_end
            printf 'secure-seed:\n  salt: "%s"\n' "$SALT" > rolia.yml
            printf 'level-seed=roliadettest\nfeature-level-seed=%s\nonline-mode=false\n' "$fs" > server.properties
            rm -f input exitcode; mkfifo input
            (java -Xmx3G -jar /tmp/rolia.jar --nogui < input > "det_$tag.log" 2>&1; echo $? > exitcode) &
            exec 3>input
            for i in $(seq 1 180); do grep -q 'Done (' "det_$tag.log" 2>/dev/null && break; [ -f exitcode ] && break; sleep 5; done
            sleep 4; echo "seed" >&3
            sleep 4; echo "locate structure minecraft:mineshaft" >&3
            sleep 5; echo "locate structure minecraft:stronghold" >&3
            sleep 5; echo "stop" >&3
            for i in $(seq 1 36); do [ -f exitcode ] && break; sleep 5; done
            exec 3>&- 2>/dev/null || true
          }
          locate_run a "$FSEED"    # level L, feature F1
          locate_run b "$FSEED"    # level L, feature F1  -> must be IDENTICAL (determinism)
          locate_run c "$FSEED2"   # level L, feature F2  -> structures must MOVE (secured by feature seed)
          coords () { grep -oE '\[-?[0-9]+, ~, -?[0-9]+\]' "det_$1.log" | tr '\n' ' '; }
          CA=$(coords a); CB=$(coords b); CC=$(coords c)
          echo "A (L,F1): $CA"; echo "B (L,F1): $CB"; echo "C (L,F2): $CC"
          if [ -z "$CA" ] || [ -z "$CB" ] || [ -z "$CC" ]; then echo "FAIL: locate produced no coords - cannot verify determinism/seed-split"; exit 1; fi
          if [ "$CA" != "$CB" ]; then echo "FAIL: non-deterministic (A!=B with identical seeds)"; exit 1; fi
          if [ "$CA" = "$CC" ]; then echo "FAIL: structures did NOT move when feature seed changed -> not secured by feature seed"; exit 1; fi
          echo "OK: determinism (A==B) + seed-split (structures move with feature seed, A!=C) verified"

      - name: DAB enabled smoke
        run: |
          set -x
          set +e +o pipefail
          cd testrun
          rm -rf world world_nether world_the_end
          printf 'secure-seed:\n  salt: "DABSMOKEDABSMOKEDABSMOKEDABSMOKEDABSMOKEDABSMOKEDABSMOKEDABSMOKE01"\ndab:\n  enabled: true\n  start-distance: 8\n  max-tick-interval: 20\n  blacklist: []\n' > rolia.yml
          printf 'level-seed=dabtest\nonline-mode=false\n' > server.properties
          rm -f input exitcode; mkfifo input
          (java -Xmx3G -jar /tmp/rolia.jar --nogui < input > dab.log 2>&1; echo $? > exitcode) &
          exec 3>input
          for i in $(seq 1 180); do grep -q 'Done (' dab.log 2>/dev/null && break; [ -f exitcode ] && break; sleep 5; done
          sleep 8; echo "stop" >&3
          for i in $(seq 1 36); do [ -f exitcode ] && break; sleep 5; done
          exec 3>&- 2>/dev/null || true
          echo "=== DAB run: config + startup ==="
          grep -iE 'config loaded|DAB (ON|off)|secure seed active|Generating a new' dab.log | head
          grep -q 'Done (' dab.log || { echo "FAIL: DAB run did not start"; tail -100 dab.log; exit 1; }
          if grep -Eq 'Exception in thread|Caused by:' dab.log; then echo "FAIL: exceptions with DAB on"; grep -nE 'Exception in thread|Caused by:' dab.log | head; exit 1; fi
          echo "DAB ENABLED SMOKE OK: clean startup with dab.enabled=true"

      - name: Auto-random seed test (fresh server => unique 1024-bit seed)
        run: |
          set -x
          set +e +o pipefail
          cd testrun
          fresh_run () {
            tag="$1"
            rm -rf world world_nether world_the_end rolia.yml rolia-seed.properties
            printf 'level-seed=samelevel\nonline-mode=false\n' > server.properties
            rm -f input exitcode; mkfifo input
            (java -Xmx3G -jar /tmp/rolia.jar --nogui < input > "auto_$tag.log" 2>&1; echo $? > exitcode) &
            exec 3>input
            for i in $(seq 1 180); do grep -q 'Done (' "auto_$tag.log" 2>/dev/null && break; [ -f exitcode ] && break; sleep 5; done
            sleep 4; echo "seed" >&3
            sleep 4; echo "stop" >&3
            for i in $(seq 1 36); do [ -f exitcode ] && break; sleep 5; done
            exec 3>&- 2>/dev/null || true
          }
          fresh_run a
          fresh_run b
          FA=$(grep -oiE 'feature seed: \[[0-9]+\]' auto_a.log | head -1)
          FB=$(grep -oiE 'feature seed: \[[0-9]+\]' auto_b.log | head -1)
          echo "A feature seed: $FA"
          echo "B feature seed: $FB"
          [ -n "$FA" ] && [ -n "$FB" ] || { echo "FAIL: feature seed not auto-generated on fresh start"; exit 1; }
          [ "$FA" != "$FB" ] || { echo "FAIL: two fresh servers got the SAME feature seed"; exit 1; }
          grep -qi 'secure seed active' auto_a.log || { echo "FAIL: secure seed not active on fresh start"; exit 1; }
          echo "AUTO-RANDOM OK: fresh servers get DIFFERENT 1024-bit feature seeds; secure seed always active"

      - name: Publish result to ci-output branch
        if: always()
        run: |
          set -x
          set +e +o pipefail  # Rolia - never let an empty glob/grep abort the publish before the git push
          mkdir -p /tmp/out
          find . -name '*paperclip*.jar' -not -path './testrun/*' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          cp testrun/server_*.log /tmp/out/ 2>/dev/null || true
          cp testrun/det_*.log /tmp/out/ 2>/dev/null || true
          cp testrun/dab.log /tmp/out/ 2>/dev/null || true
          cp testrun/auto_*.log /tmp/out/ 2>/dev/null || true
          cp apply.log build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          f=$(ls *paperclip*.jar 2>/dev/null | head -1); if [ -n "$f" ] && [ "$f" != "rolia-paperclip-26.1.2.jar" ]; then mv "$f" rolia-paperclip-26.1.2.jar; fi
          for f in *.jar; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          # Rolia - GitHub 500s on a >50MB single blob pushed to ci-output; commit the jar in <50MB parts instead.
          # Keep the full jar in /tmp/out for the Release step (which handles large assets fine).
          if [ -f rolia-paperclip-26.1.2.jar ]; then split -b 40m rolia-paperclip-26.1.2.jar rolia-paperclip-26.1.2.jar.part.; printf 'rolia-paperclip-26.1.2.jar\n' > .gitignore; fi
          echo "status=${{ job.status }}" > status.txt
          echo "commit=$GITHUB_SHA" >> status.txt
          # truncate big logs
          for f in apply.log build.log; do [ -f "$f" ] && tail -c 500000 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          git init -b ci-output
          git config user.email "ci@rolia.local"
          git config user.name "Rolia CI"
          git add -A
          git commit -m "CI output for $GITHUB_SHA" || git commit --allow-empty -m "CI output for $GITHUB_SHA (no changes)"  # Rolia - never let the publish step fail on empty
          set +x  # Rolia - do NOT echo the token URL into the public Actions log
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-output

      - name: Create GitHub Release
        if: success() && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v26.1.2-build.36"
          JAR=/tmp/out/rolia-paperclip-26.1.2.jar
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          cat > /tmp/relnotes.md << NOTES
          ## Rolia 26.1.2

          **Rolia** — высокопроизводительное ядро Minecraft на базе Canvas с полной поддержкой 1024-битного сида.

          ### Особенности
          - Вся производительность Canvas: региональная многопоточность (Folia), оптимизации тиков, чанков и сущностей.
          - **1024-битный защищённый сид (всегда включён)**: структуры, данжи, руды-фичи, жеоды и слизневые чанки генерируются от секретного 1024-битного сида — подбор по миру практически невозможен. Рельеф и биомы — от обычного level-seed (мир воспроизводим). На каждом новом сервере сид генерируется свой, случайный.
          - Секретная соль в \`rolia.yml\` (права 0600) — мастер-ключ защиты. Единый конфиг rolia.yml; опциональный DAB (троттлинг ИИ дальних мобов, по умолчанию выключен).
          - Команда \`/seed\` показывает и ванильный сид, и feature seed.
          - Параметр \`feature-level-seed\` в \`server.properties\` для задания своего 1024-битного сида.

          ### Запуск
          Требуется Java 25+.
          \`\`\`
          java -Xmx4G -jar rolia-paperclip-26.1.2.jar --nogui
          \`\`\`

          ### Контрольная сумма
          SHA-256: \`$SHA\`
          NOTES
          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rolia 26.1.2 (build 36)" \
            --notes-file /tmp/relnotes.md \
            --latest
