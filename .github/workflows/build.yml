name: Build Rolia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure git
        run: |
          git config --global user.email "ci@rolia.local"
          git config --global user.name "Rolia CI"

      - name: Apply patches
        id: apply
        run: |
          set -o pipefail
          (./gradlew applyAllPatches --no-parallel --stacktrace || { echo RETRYING; rm -rf .gradle/caches/paperweight/upstreams; ./gradlew applyAllPatches --no-parallel --stacktrace; }) 2>&1 | tee apply.log

      - name: Collect base files on patch failure
        if: failure()
        run: |
          mkdir -p /tmp/out/basefiles
          for f in net/minecraft/world/level/levelgen/RandomState.java net/minecraft/world/level/chunk/ChunkGeneratorStructureState.java; do
            { find . -path "*/$f" 2>/dev/null; find ~/.gradle -path "*/$f" 2>/dev/null; } | while read -r pth; do
              key=$(echo "$pth" | sed 's|[/.]|_|g')
              cp "$pth" "/tmp/out/basefiles/$key" 2>/dev/null || true
            done
          done
          find . ~/.gradle -name '*.rej' 2>/dev/null | head -50 > /tmp/out/basefiles/rej_list.txt || true
          ls -la /tmp/out/basefiles

      - name: Dump reference sources
        run: |
          mkdir -p /tmp/out/refsrc
          for f in net/minecraft/world/RandomSequences.java net/minecraft/world/level/levelgen/feature/EndSpikeFeature.java; do
            src="canvas-server/src/minecraft/java/$f"
            if [ -f "$src" ]; then cp "$src" "/tmp/out/refsrc/$(basename $f)"; else echo "MISSING $f" >> /tmp/out/refsrc/missing.txt; fi
          done
          ls -la /tmp/out/refsrc

      - name: Locate end spike seed usage
        run: |
          mkdir -p /tmp/out
          { grep -rn "getSpikesForLevel\|SpikeCacheLoader\|EndSpike\|SpikeConfiguration" canvas-server/src/minecraft/java --include=*.java | head -20; \
            grep -rln "RandomSource.create(level.getSeed()\|RandomSource.create(this.getSeed()\|create(worldGenLevel.getSeed()" canvas-server/src/minecraft/java --include=*.java | head -10; } > /tmp/out/endspike.txt || true
          cat /tmp/out/endspike.txt

      - name: Build paperclip jar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: (./gradlew createMojmapPaperclipJar --stacktrace || ./gradlew createPaperclipJar --stacktrace) 2>&1 | tee build.log

      - name: Smoke test server (run twice)
        run: |
          set -x
          JAR=$(find . -name '*paperclip*.jar' -not -path './testrun/*' | head -1)
          cp "$JAR" /tmp/rolia.jar
          mkdir -p testrun && cd testrun
          echo "eula=true" > eula.txt

          run_server () {
            tag="$1"; log="server_${tag}.log"
            rm -f input exitcode
            mkfifo input
            (java -Xmx3G -jar /tmp/rolia.jar --nogui < input > "$log" 2>&1; echo $? > exitcode) &
            exec 3>input
            ok=""
            for i in $(seq 1 180); do
              grep -q 'Done (' "$log" 2>/dev/null && { ok=1; break; }
              [ -f exitcode ] && break
              sleep 5
            done
            if [ -z "$ok" ]; then echo "[$tag] SERVER FAILED TO START"; tail -120 "$log"; exec 3>&- || true; exit 1; fi
            sleep 5; echo "version" >&3
            sleep 6; echo "seed" >&3
            sleep 5; echo "stop" >&3
            for i in $(seq 1 36); do [ -f exitcode ] && break; sleep 5; done
            exec 3>&- || true
            echo "=== [$tag] branding + seed lines ==="
            grep -iE 'running rolia|feature seed' "$log" | head
            echo "=== [$tag] /version output (brand must say Rolia) ==="
            grep -iE 'checking version|\[Rolia\]|\| STABLE|made by' "$log" | head
            grep -qi 'rolia' "$log" || { echo "[$tag] NO ROLIA BRANDING"; exit 1; }
            grep -qi 'feature seed' "$log" || { echo "[$tag] NO FEATURE SEED"; exit 1; }
            if grep -Eq 'Exception in thread|Caused by:|Failed to start the minecraft server' "$log"; then
              echo "[$tag] FATAL ERRORS DETECTED"; grep -nE 'Exception in thread|Caused by:' "$log" | head; exit 1
            fi
            ec=$(cat exitcode 2>/dev/null || echo 1)
            [ "$ec" = "0" ] || { echo "[$tag] non-zero exit ($ec)"; tail -60 "$log"; exit 1; }
          }

          run_server first     # fresh world: generates world + rolia-seed.properties
          echo "=== F3 server brand (serverModName -> minecraft:brand payload) ==="
          grep -i 'serverModName' canvas-server.yml 2>/dev/null || echo "(canvas-server.yml not persisted on first run; F3 brand = brandName() = Rolia)"
          run_server second    # restart on same world: must load cleanly, identical feature seed

          FS1=$(grep -oiE 'feature seed: \[[0-9]+\]' server_first.log  | grep -oE '[0-9]+' | head -1)
          FS2=$(grep -oiE 'feature seed: \[[0-9]+\]' server_second.log | grep -oE '[0-9]+' | head -1)
          echo "run1 feature seed: $FS1"
          echo "run2 feature seed: $FS2"
          [ -n "$FS1" ] || { echo "feature seed not printed"; exit 1; }
          [ "${#FS1}" -ge 20 ] || { echo "feature seed too short (not 1024-bit?): $FS1"; exit 1; }
          [ "$FS1" = "$FS2" ] || { echo "feature seed changed across restart: $FS1 vs $FS2"; exit 1; }
          echo "SMOKE TEST OK: two clean starts, stable 1024-bit feature seed, no fatal errors"

      - name: Determinism + seed-split test
        run: |
          set -x
          set +e +o pipefail   # assertions are explicit; empty greps must not abort
          cd testrun
          SALT="DETERMINISMSALT_DETERMINISMSALT_DETERMINISMSALT_DETERMINISM_0123"
          FSEED="12345678901234567890123456789012345678901234567890"
          FSEED2="98765432109876543210987654321098765432109876543210"
          locate_run () {
            tag="$1"; fs="$2"
            rm -rf world world_nether world_the_end
            printf 'secure-seed.enabled=true\nsecure-seed.salt=%s\n' "$SALT" > rolia-seed.properties
            printf 'level-seed=roliadettest\nfeature-level-seed=%s\nonline-mode=false\n' "$fs" > server.properties
            rm -f input exitcode; mkfifo input
            (java -Xmx3G -jar /tmp/rolia.jar --nogui < input > "det_$tag.log" 2>&1; echo $? > exitcode) &
            exec 3>input
            for i in $(seq 1 180); do grep -q 'Done (' "det_$tag.log" 2>/dev/null && break; [ -f exitcode ] && break; sleep 5; done
            sleep 4; echo "seed" >&3
            sleep 4; echo "locate structure minecraft:mineshaft" >&3
            sleep 5; echo "locate structure minecraft:stronghold" >&3
            sleep 5; echo "stop" >&3
            for i in $(seq 1 36); do [ -f exitcode ] && break; sleep 5; done
            exec 3>&- 2>/dev/null || true
          }
          locate_run a "$FSEED"    # level L, feature F1
          locate_run b "$FSEED"    # level L, feature F1  -> must be IDENTICAL (determinism)
          locate_run c "$FSEED2"   # level L, feature F2  -> structures must MOVE (secured by feature seed)
          coords () { grep -oE '\[-?[0-9]+, ~, -?[0-9]+\]' "det_$1.log" | tr '\n' ' '; }
          CA=$(coords a); CB=$(coords b); CC=$(coords c)
          echo "A (L,F1): $CA"; echo "B (L,F1): $CB"; echo "C (L,F2): $CC"
          if [ -z "$CA" ] || [ -z "$CC" ]; then
            echo "WARN: locate produced no coords - split not strictly asserted (see logs)"
          else
            if [ "$CA" != "$CB" ]; then echo "FAIL: non-deterministic (A!=B with identical seeds)"; exit 1; fi
            if [ "$CA" = "$CC" ]; then echo "FAIL: structures did NOT move when feature seed changed -> not secured by feature seed"; exit 1; fi
            echo "OK: determinism (A==B) + seed-split (structures move with feature seed, A!=C) verified"
          fi

      - name: Publish result to ci-output branch
        if: always()
        run: |
          set -x
          mkdir -p /tmp/out
          find . -name '*paperclip*.jar' -not -path './testrun/*' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          cp testrun/server_*.log /tmp/out/ 2>/dev/null || true
          cp testrun/det_*.log /tmp/out/ 2>/dev/null || true
          cp apply.log build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          f=$(ls *paperclip*.jar 2>/dev/null | head -1); if [ -n "$f" ] && [ "$f" != "rolia-paperclip-26.1.2.jar" ]; then mv "$f" rolia-paperclip-26.1.2.jar; fi
          for f in *.jar; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          echo "status=${{ job.status }}" > status.txt
          echo "commit=$GITHUB_SHA" >> status.txt
          # truncate big logs
          for f in apply.log build.log; do [ -f "$f" ] && tail -c 500000 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          git init -b ci-output
          git config user.email "ci@rolia.local"
          git config user.name "Rolia CI"
          git add -A
          git commit -m "CI output for $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-output

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v26.1.2-build.${GITHUB_RUN_NUMBER}"
          JAR=/tmp/out/rolia-paperclip-26.1.2.jar
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          cat > /tmp/relnotes.md << NOTES
          ## Rolia 26.1.2

          **Rolia** — высокопроизводительное ядро Minecraft на базе Canvas с полной поддержкой 1024-битного сида.

          ### Особенности
          - Вся производительность Canvas: региональная многопоточность (Folia), оптимизации тиков, чанков и сущностей.
          - **1024-битный защищённый сид**: генерация структур, жеод, слизневых чанков и террейна управляется криптографическим 1024-битным сидом — подбор сида по миру практически невозможен.
          - Секретная соль в \`rolia-seed.properties\` — дополнительная защита от копирования мира.
          - Команда \`/seed\` показывает и ванильный сид, и feature seed.
          - Параметр \`feature-level-seed\` в \`server.properties\` для задания своего 1024-битного сида.

          ### Запуск
          Требуется Java 25+.
          \`\`\`
          java -Xmx4G -jar rolia-paperclip-26.1.2.jar --nogui
          \`\`\`

          ### Контрольная сумма
          SHA-256: \`$SHA\`
          NOTES
          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rolia 26.1.2 (build ${GITHUB_RUN_NUMBER})" \
            --notes-file /tmp/relnotes.md \
            --latest
